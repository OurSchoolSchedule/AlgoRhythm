# 테스트 전용 프로파일 (@ActiveProfiles("test"))
# 외부 MySQL/Redis/SMTP 없이도 Spring 컨텍스트가 로드되도록 인메모리 H2를 사용한다.
# CI(.github/workflows/ci.yml)의 backend-test 잡에서 이 프로파일로 ./gradlew test 가 실행된다.
server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 3025
    username: test@example.com
    password: test

email:
  verification:
    expiration: '5'
    allowed-domains:
      - ewha.ac.kr
      - gmail.com

oauth:
  kakao:
    client-id: test_client_id
    client-secret: test_client_secret
    redirect-uri: http://localhost:8080/api/auth/kakao/callback

jwt:
  secret: ci_test_secret_key_minimum_256_bits_for_hs256_algorithm_padding_xxxx
